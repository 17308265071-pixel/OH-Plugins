schemaVersion: 1
id: hana-max-thinking
name: Max Thinking
publisher: "2990927961"
author: "2990927961"
version: 0.2.0
description: Force every chat model in every Hana session and channel (desktop / phone / bridge) to run at its highest supported thinking level, sync the level into session metadata, and inject a system-prompt guide so agents answer thinking-level questions with real status instead of guesses.
license: MIT
categories:
  - Utilities
  - Agent
keywords:
  - thinking
  - glm
  - channel
  - reasoning
